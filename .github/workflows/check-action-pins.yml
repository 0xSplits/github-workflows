name: Check action pins

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require immutable action and reusable workflow references
        shell: ruby {0}
        run: |
          require "date"
          require "set"
          require "yaml"

          files = IO.popen(["git", "ls-files", "-z"], &:read).split("\0")
          abort "Cannot list tracked files" unless $?.success?
          files.select! do |file|
            file.match?(%r{\A\.github/workflows/[^/]+\.ya?ml\z}) ||
              file.match?(%r{(?:\A|/)action\.ya?ml\z})
          end

          errors = []
          files.each do |file|
            if File.symlink?(file)
              errors << "#{file}: workflow and action files must not be symlinks"
              next
            end

            begin
              document = YAML.safe_load(File.read(file), permitted_classes: [Date, Time], aliases: true)
              visited = Set.new
              check = lambda do |node|
                next unless node.is_a?(Hash) || node.is_a?(Array)
                next unless visited.add?(node.object_id)

                if node.is_a?(Hash)
                  if node.key?("uses")
                    ref = node["uses"]
                    pinned = ref.is_a?(String) && (
                      ref.start_with?("./") ||
                      ref.match?(%r{\Adocker://[^\s@]+@sha256:[0-9a-f]{64}\z}) ||
                      ref.match?(%r{\A[\w.-]+/[\w.-]+(?:/[^\s@]+)?@[0-9a-fA-F]{40}\z})
                    )
                    errors << "#{file}: unpinned uses: #{ref.inspect}" unless pinned
                  end
                  node.each_value { |value| check.call(value) }
                else
                  node.each { |value| check.call(value) }
                end
              end
              check.call(document)
            rescue Psych::Exception => error
              errors << "#{file}: invalid YAML: #{error.message}"
            end
          end

          abort errors.join("\n") unless errors.empty?
          puts "Checked #{files.length} workflow and action files; all external references are immutable."

      - name: Test the pin checker
        if: github.repository == '0xSplits/github-workflows'
        run: ruby .github/scripts/check-action-pins_test.rb
